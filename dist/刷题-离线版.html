<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>刷题</title>
<style>:root {
  --bg: #f5f4f0; --card: #fff; --ink: #2b2a26; --muted: #8a877d;
  --line: #e5e2d8; --accent: #4a6fa5; --accent-soft: #e8eef7;
  --ok: #4f8f5f; --ok-soft: #e9f3ec; --bad: #c0564f; --bad-soft: #faeceb;
  --warn: #b8860b; --warn-soft: #faf3e3;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  font-size: 16px; line-height: 1.65;
  padding-bottom: env(safe-area-inset-bottom);
}
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border-bottom: 1px solid var(--line);
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
}
.brand { font-size: 20px; font-weight: 700; color: var(--accent); }
.brand .sub { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.top-actions { display: flex; gap: 8px; }
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 40px; }

.btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 9px 16px; border-radius: 10px; font-size: 15px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; }

.paper-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-bottom: 12px; cursor: pointer;
}
.paper-card:active { background: var(--accent-soft); }
.paper-name { font-weight: 600; }
.paper-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.progress { height: 6px; background: #eee; border-radius: 3px; margin-top: 10px; overflow: hidden; }
.progress > div { height: 100%; background: var(--ok); }

.paper-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.paper-top #paper-title { font-weight: 600; flex: 1; }

.question-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.q-stem { white-space: pre-wrap; font-size: 17px; margin-bottom: 14px; }
.opt-btn {
  display: block; width: 100%; text-align: left; margin-bottom: 8px;
  border: 1px solid var(--line); background: #fff; border-radius: 10px;
  padding: 12px 14px; font-size: 16px; cursor: pointer; line-height: 1.5;
}
.opt-btn.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt-btn.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt-btn:disabled { opacity: .85; }

.grade-btn { width: 48%; }
.grade-btn.ok { border-color: var(--ok); color: var(--ok); }
.grade-btn.bad { border-color: var(--bad); color: var(--bad); }

#q-answer {
  margin-top: 14px; padding: 12px; border-radius: 10px;
  background: #fbfaf6; border: 1px solid var(--line);
  white-space: pre-wrap; font-size: 15px;
}
#q-answer .ans-label { color: var(--ok); font-weight: 600; }
#q-insight { margin-top: 14px; }
#q-insight textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; font-size: 15px; font-family: inherit; resize: vertical;
  min-height: 76px;
}
.q-foot { display: flex; gap: 10px; margin-top: 16px; }
.q-foot .btn { flex: 1; }
.q-foot #btn-star { flex: 0 0 auto; }
.q-foot #btn-star.starred { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
#q-counts { margin-top: 10px; text-align: center; }
.empty { color: var(--muted); text-align: center; padding: 40px 16px; line-height: 2; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 20px; background: #f0eee6; color: var(--muted); }
.badge.subject { background: var(--accent-soft); color: var(--accent); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">刷题<span class="sub">与「织题」联动</span></div>
  <div class="top-actions">
    <label class="btn small">导入数据<input type="file" id="import-file" accept=".json,application/json" hidden></label>
    <button class="btn small" id="btn-export">导出数据</button>
  </div>
</header>

<main id="app"></main>

<template id="tpl-home">
  <div id="paper-list"></div>
  <div class="empty" id="home-empty" hidden>
    还没有题库。先在 Mac 上用织题的「PDF 导入」生成刷题 JSON，然后把文件放到 iCloud Drive，
    在这里点「导入数据」选择它。
  </div>
</template>

<template id="tpl-paper">
  <div class="paper-top">
    <button class="btn small" id="btn-back">← 返回</button>
    <span id="paper-title"></span>
    <span id="paper-progress" class="qmeta"></span>
  </div>
  <div class="question-card" id="qcard">
    <div id="q-stem" class="q-stem"></div>
    <div id="q-options"></div>
    <div id="q-essay" hidden>
      <p class="qmeta">本题为问答/材料题，请对照参考答案自评：</p>
      <button class="btn grade-btn ok" id="btn-right">标记正确</button>
      <button class="btn grade-btn bad" id="btn-wrong">标记错误</button>
    </div>
    <div id="q-answer" hidden></div>
    <div id="q-insight" hidden>
      <div class="qmeta">心得（会随导出带回织题）</div>
      <textarea id="insight-input" rows="3" placeholder="写下你的思路、为什么错、以后注意什么"></textarea>
    </div>
    <div class="q-foot">
      <button class="btn" id="btn-prev">上一题</button>
      <button class="btn" id="btn-star">☆ 收藏</button>
      <button class="btn primary" id="btn-next">下一题</button>
    </div>
  </div>
  <div id="q-counts" class="qmeta"></div>
</template>

<script>'use strict';

// ---------- 数据层 ----------
const LS_KEY = 'zhiti_shuati_v1';
let data = loadData();
let view = { name: 'home', paperIdx: 0, qIdx: 0, answered: false };

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && Array.isArray(d.papers)) return d;
  } catch (e) { /* ignore */ }
  return { version: 1, papers: [], records: {} };
}
function saveData() { localStorage.setItem(LS_KEY, JSON.stringify(data)); }

function recKey(p, q) { return p.id + '::' + q.id; }
function getRec(p, q) {
  const r = data.records[recKey(p, q)];
  return r || { status: 'unanswered', starred: false, insight: '', updatedAt: '' };
}
function setRec(p, q, patch) {
  const k = recKey(p, q);
  data.records[k] = Object.assign({}, data.records[k], patch, { updatedAt: new Date().toISOString() });
  saveData();
}

// ---------- 工具 ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function toast(msg) {
  const d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-size:14px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2500);
}
function downloadJSON(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ---------- 渲染 ----------
const main = $('#app');
const tplHome = $('#tpl-home');
const tplPaper = $('#tpl-paper');

function render() {
  if (view.name === 'home') renderHome();
  else renderPaper();
}

function renderHome() {
  main.innerHTML = tplHome.innerHTML;
  const list = $('#paper-list');
  if (!data.papers.length) {
    $('#home-empty').hidden = false;
    return;
  }
  list.innerHTML = data.papers.map((p, i) => {
    const total = (p.questions || []).length;
    let done = 0, wrong = 0, starred = 0;
    for (const q of p.questions || []) {
      const r = getRec(p, q);
      if (r.status !== 'unanswered') done++;
      if (r.status === 'wrong') wrong++;
      if (r.starred) starred++;
    }
    const pct = total ? Math.round(done / total * 100) : 0;
    return `<div class="paper-card" onclick="startPaper(${i})">
      <div class="paper-name">${esc(p.name)} <span class="badge subject">${esc(p.subject || '')}</span></div>
      <div class="paper-meta">${done}/${total} 已做 · 🔴 ${wrong} · ⭐ ${starred}</div>
      <div class="progress"><div style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function startPaper(i) {
  view = { name: 'paper', paperIdx: i, qIdx: 0, answered: false };
  renderPaper();
}

function renderPaper() {
  const p = data.papers[view.paperIdx];
  if (!p) { view.name = 'home'; renderHome(); return; }
  main.innerHTML = tplPaper.innerHTML;
  $('#paper-title').textContent = p.name;
  const qs = p.questions || [];
  const q = qs[view.qIdx];
  $('#paper-progress').textContent = `${view.qIdx + 1} / ${qs.length}`;
  if (!q) { main.innerHTML = '<div class="empty">这套卷没有题目</div>'; return; }

  const rec = getRec(p, q);
  $('#q-stem').textContent = q.stem;
  $('#btn-star').textContent = rec.starred ? '★ 已收藏' : '☆ 收藏';
  $('#btn-star').classList.toggle('starred', !!rec.starred);

  const opts = q.options || [];
  const isChoice = opts.length > 0;
  $('#q-essay').hidden = isChoice;
  $('#q-options').hidden = !isChoice;
  if (isChoice) {
    $('#q-options').innerHTML = opts.map(o => `<button class="opt-btn" data-opt="${esc(o)}" onclick="answerChoice(this)">${esc(o)}</button>`).join('');
  }
  view.answered = rec.status !== 'unanswered';
  if (view.answered) showAnswerPanel(rec, q);
  $('#q-answer').hidden = !view.answered;
  $('#q-insight').hidden = !view.answered;

  // 心得回填
  if (view.answered) {
    const ta = $('#insight-input');
    ta.value = rec.insight || '';
    ta.oninput = debounce(() => setRec(p, q, { insight: ta.value }), 400);
  }

  updateCounts();
  $('#btn-prev').disabled = view.qIdx === 0;
  $('#btn-next').textContent = view.qIdx === qs.length - 1 ? '完成' : '下一题';
}

function answerChoice(btn) {
  const p = data.papers[view.paperIdx];
  const q = (p.questions || [])[view.qIdx];
  if (view.answered) return;
  const opts = q.options || [];
  const ansLetter = letterOf(q.answer);
  const chosenLetter = letterOf(btn.dataset.opt);
  const correct = ansLetter && chosenLetter === ansLetter;
  const status = correct ? 'right' : 'wrong';
  setRec(p, q, { status });
  view.answered = true;
  $$('#q-options .opt-btn').forEach(b => {
    b.disabled = true;
    if (letterOf(b.dataset.opt) === ansLetter) b.classList.add('correct');
    else if (b === btn && !correct) b.classList.add('wrong');
  });
  showAnswerPanel(getRec(p, q), q);
  $('#q-answer').hidden = false;
  $('#q-insight').hidden = false;
  updateCounts();
}

function gradeEssay(status) {
  const p = data.papers[view.paperIdx];
  const q = (p.questions || [])[view.qIdx];
  setRec(p, q, { status });
  view.answered = true;
  showAnswerPanel(getRec(p, q), q);
  $('#q-answer').hidden = false;
  $('#q-insight').hidden = false;
  updateCounts();
}

function showAnswerPanel(rec, q) {
  const box = $('#q-answer');
  if (!box) return;
  const ans = q.answer || '（本题未提供答案）';
  const wrongBadge = rec.status === 'wrong' ? '<span style="color:var(--bad)"> 做错了</span>' : (rec.status === 'right' ? '<span style="color:var(--ok)"> 做对了</span>' : '');
  box.innerHTML = `<div class="ans-label">答案：${esc(ans)}${wrongBadge}</div>${q.analysis ? '<div style="margin-top:6px">' + esc(q.analysis) + '</div>' : ''}`;
  const ta = $('#insight-input');
  if (ta && !ta._bound) {
    ta._bound = true;
    ta.oninput = debounce(() => setRec(curP(), curQ(), { insight: ta.value }), 400);
  }
  if (ta) ta.value = rec.insight || '';
}

// 保存心得时用当前 paper/question
function curP() { return data.papers[view.paperIdx]; }
function curQ() { return (curP().questions || [])[view.qIdx]; }

function letterOf(s) {
  const str = String(s || '');
  const m = str.match(/^\s*([A-H])\s*[.、．)）:：]/) || str.match(/^\s*([A-H])\s*$/);
  return m ? m[1] : '';
}

function updateCounts() {
  const p = data.papers[view.paperIdx];
  const qs = p.questions || [];
  let done = 0, wrong = 0;
  qs.forEach(q => {
    const r = getRec(p, q);
    if (r.status !== 'unanswered') done++;
    if (r.status === 'wrong') wrong++;
  });
  const el = $('#q-counts');
  if (el) el.textContent = `本卷进度：${done}/${qs.length} 已做 · 错 ${wrong} 题`;
}

// ---------- 事件 ----------
function bind() {
  $('#btn-export').addEventListener('click', () => {
    downloadJSON(`刷题记录-${new Date().toISOString().slice(0, 10)}.json`, data);
  });
  $('#import-file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importData(JSON.parse(r.result));
    r.readAsText(f);
    e.target.value = '';
  });
}

function importData(fileData) {
  if (!fileData || !Array.isArray(fileData.papers)) {
    toast('文件格式不对：缺少 papers');
    return;
  }
  // 题库以文件为准
  const beforeCount = data.papers.length;
  data.papers = fileData.papers;
  // 记录合并：冲突保留 updatedAt 较新
  const fileRecs = fileData.records || {};
  let merged = 0;
  for (const [k, v] of Object.entries(fileRecs)) {
    const local = data.records[k];
    if (!local || (v.updatedAt || '') > (local.updatedAt || '')) {
      data.records[k] = v;
      merged++;
    }
  }
  saveData();
  render();
  toast(`题库已更新（${beforeCount} → ${data.papers.length} 卷），记录合并 ${merged} 条`);
}

// ---------- 导航 ----------
function nav(delta) {
  const p = data.papers[view.paperIdx];
  const qs = p.questions || [];
  const n = view.qIdx + delta;
  if (n < 0 || n >= qs.length) return;
  view.qIdx = n;
  renderPaper();
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'btn-back') { view = { name: 'home' }; render(); }
  else if (t.id === 'btn-prev') nav(-1);
  else if (t.id === 'btn-next') { if (view.qIdx === (data.papers[view.paperIdx].questions || []).length - 1) { view = { name: 'home' }; render(); } else nav(1); }
  else if (t.id === 'btn-star') {
    const p = curP(), q = curQ(), rec = getRec(p, q);
    setRec(p, q, { starred: !rec.starred });
    const b = $('#btn-star');
    b.textContent = rec.starred ? '☆ 收藏' : '★ 已收藏';
    b.classList.toggle('starred', rec.starred);
    toast(rec.starred ? '已取消收藏' : '已收藏（会随导出带回织题）');
  }
  else if (t.id === 'btn-right') gradeEssay('right');
  else if (t.id === 'btn-wrong') gradeEssay('wrong');
});

bind();
render();
</script>
</body>
</html>
